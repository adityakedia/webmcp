steps:
  - name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    args:
      - build
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/webmcp/acoustomic:$COMMIT_SHA"
      - --path
      - apps/backend
      - --builder
      - gcr.io/buildpacks/builder:latest
      - --network
      - cloudbuild
      - --publish

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - acoustomic
      - --image
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/webmcp/acoustomic:$COMMIT_SHA"
      - --region
      - "${_REGION}"
      - --platform
      - managed
      - --quiet

substitutions:
  _REGION: asia-east1

options:
  logging: CLOUD_LOGGING_ONLY
