steps:
  # Build the FastAPI service with Google Cloud Buildpacks (no Dockerfile).
  - name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    args:
      - build
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/acoustom/acoustom-api:$COMMIT_SHA
      - --path
      - apps/backend
      - --builder
      - gcr.io/buildpacks/builder:latest
      - --publish
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/acoustom/acoustom-api:$COMMIT_SHA
