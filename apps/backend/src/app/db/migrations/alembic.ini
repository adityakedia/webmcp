[postgresql]
driver = psycopg2
database = acoustom
user = acoustom
password = acoustom
host = localhost
port = 5432

[alembic]
script_location = src/app/db/migrations
sqlalchemy.url = postgresql+psycopg2://acoustom:acoustom@localhost:5432/acoustom

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
