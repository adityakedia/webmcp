version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ../apps/backend
      dockerfile: ../../infra/Dockerfile.backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://acoustom:acoustom@postgres:5432/acoustom
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost"]'}
      NEON_AUTH_JWKS_URL: ${NEON_AUTH_JWKS_URL:-}
      NEON_AUTH_ISSUER: ${NEON_AUTH_ISSUER:-}
      NEON_AUTH_AUDIENCE: ${NEON_AUTH_AUDIENCE:-}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: acoustom
      POSTGRES_PASSWORD: acoustom
      POSTGRES_DB: acoustom
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
