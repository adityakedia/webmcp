services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: acoustom
      POSTGRES_PASSWORD: acoustom
      POSTGRES_DB: acoustom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../apps/backend
      dockerfile: ../../infra/Dockerfile.backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../apps/backend/src:/app/src
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://acoustom:acoustom@postgres:5432/acoustom
    depends_on:
      - postgres

volumes:
  postgres_data:
